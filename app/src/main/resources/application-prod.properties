# Production profile — activate with SPRING_PROFILES_ACTIVE=prod.
# Datasource comes from the environment (no secrets in the repo). The frontend is bundled into
# this same app (served at /), so the API is same-origin and no CORS config is needed.

# Bind to the platform-provided port (Render/Railway/Heroku set $PORT), else 8080.
server.port=${PORT:8080}

# PostgreSQL. Either set SPRING_DATASOURCE_URL directly, or provide DB_HOST/DB_PORT/DB_NAME
# (render.yaml wires these from the managed database).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:superbowlrun}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
