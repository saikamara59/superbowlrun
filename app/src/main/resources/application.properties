spring.application.name=superbowlrun

# Keep the terminal clean for the M1 draft game (no Spring banner, warnings only).
spring.main.banner-mode=off
logging.level.root=WARN

# M3: persistence — file-based H2 so saved teams survive restarts.
spring.datasource.url=jdbc:h2:file:./data/superbowlrun;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Browse the DB at http://localhost:8080/h2-console (JDBC URL above, user sa, no password).
spring.h2.console.enabled=true
