# Local "production-like" run: the same Docker image + a Postgres, so you can test the
# deployed shape before pushing.  Usage:  docker compose up --build  →  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: superbowlrun
      POSTGRES_USER: superbowlrun
      POSTGRES_PASSWORD: superbowlrun
    volumes:
      - dbdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_NAME: superbowlrun
      DB_USER: superbowlrun
      DB_PASSWORD: superbowlrun
    depends_on:
      - db

volumes:
  dbdata:
