spring.application.name=superbowlrun

# Keep the terminal clean for the M1 draft game (no Spring banner, warnings only).
spring.main.banner-mode=off
logging.level.root=WARN

# M3: persistence — file-based H2 so saved teams survive restarts.
spring.datasource.url=jdbc:h2:file:./data/superbowlrun;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# H2 web console is OFF by default (it's an unauthenticated DB surface). Enable it only locally
# with the "dev" profile: ./mvnw -pl app spring-boot:run -Dspring-boot.run.profiles=dev
# (see application-dev.properties), then browse http://localhost:8080/h2-console.
